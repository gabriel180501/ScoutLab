services:
  postgres:
    image: postgres:17-alpine
    container_name: scoutlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: scoutlab
      POSTGRES_USER: scoutlab
      POSTGRES_PASSWORD: scoutlab_dev
    ports:
      - "5432:5432"
    volumes:
      - scoutlab_postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoutlab -d scoutlab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  scoutlab_postgres_data:

